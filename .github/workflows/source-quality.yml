name: Source quality gates

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-build:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm run check
      - name: Regression-test learning journeys and robotics scoring
        run: pnpm exec vitest run client/src/lib/learningEcosystem.test.ts client/src/lib/visualGameEngine.test.ts client/src/lib/learningProgress.test.ts client/src/lib/familyPracticeSummary.test.ts server/seo.routes.test.ts server/spa.routes.test.ts
      - name: Build Vite client and production Node bundle
        run: pnpm run build
      - name: Bundle public SEO HTTP smoke target
        run: pnpm exec esbuild server/_core/seoPages.ts --platform=node --packages=external --bundle --format=esm --outfile=dist/seo-pages-smoke.mjs
      - name: Check generated public SEO responses over HTTP
        run: node scripts/seo-http-smoke.mjs
      - name: Verify built server and client entrypoints
        run: |
          test -f dist/index.js
          test -f dist/public/index.html
          test -f dist/public/sitemap.xml
          test -f dist/public/robots.txt
