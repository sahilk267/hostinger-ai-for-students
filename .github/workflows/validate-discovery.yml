name: Validate Discovery Universe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm check
      - name: Run tests
        env:
          JWT_SECRET: "CI-ONLY-NOT-A-PRODUCTION-SECRET-2026"
          HOSTINGER_MAIL_API_TOKEN: "CI-DUMMY-TOKEN-NOT-VALID"
          AUTH_MAIL_FROM: "auth@aiforstudents.in"
        run: pnpm test
      - name: Build production assets
        run: pnpm build
